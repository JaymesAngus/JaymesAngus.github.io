---
layout: default
title: Bookshelf
extra_css: |
  <link href="/static/stylesheets/bookshelf.css" rel="stylesheet" type="text/css" media="all">
---
<h1 style="color: #cccccc">bookshelf</h1>
<div class="filter-section">
    <div class="filter-controls">
    <button class="filter-button active" data-filter="reading">Currently Reading</button>
      <button class="filter-button" data-filter="finished">Finished</button>
      <button class="filter-button" data-filter="toread">To read</button>
    </div>
    <br>
</div>

<div class="bookshelf">
  <div class="loading">JavaScript not supported (there should be a grid of book covers here).</div>
</div>
<script>
  (function(){
    let books = [];

    function createBookElement(b, status) {
      const div = document.createElement('div');
      div.className = 'book';
      div.dataset.status = status;

      div.addEventListener('click', function(e) {
        e.stopPropagation();
        document.querySelectorAll('.book').forEach(book => {
          if (book !== this) book.classList.remove('active');
        });
        this.classList.toggle('active');
      });

      const img = document.createElement('img');
      img.className = 'book-cover';
      img.src = '/static/images/BookCovers/' + (b.cover || '');
      img.alt = b.title || '';
      img.loading = 'lazy';
      div.appendChild(img);

      const info = document.createElement('div');
      info.className = 'book-info';

      const authorList = joinNameList(b.authors)
      if (status === 'toread') {
        info.innerHTML = b.title + '<br>-<br>Written by '+authorList+'<br>';
      } else if (status === 'reading') {
        info.innerHTML = b.title + '<br>-<br>Written by '+authorList+'<br>'
      }
      else {
        if (b.date_finished.match('..\/..\/..')) {
          info.innerHTML = b.title + '<br>-<br>Written by '+authorList+'<br>' + '<br>-<br>Finished on ' + b.date_finished;
        } else if (b.date_finished == 0){
          info.innerHTML = b.title + '<br>-<br>Written by '+authorList+'<br>' + '<br>-<br>Read long ago';
        } else {
          info.innerHTML = b.title + '<br>-<br>Written by '+authorList+'<br>' + '<br>-<br>Read during ' + b.date_finished;
        }
      }
      div.appendChild(info);
      return div;
    }

    function joinNameList(items) {
      if (items.length === 0) return '';
      if (items.length === 1) return items[0];
      if (items.length === 2) return `${items[0]} and ${items[1]}`;
      return `${items.slice(0, -1).join(', ')}, and ${items.at(-1)}`;
    }

    function finishedYear(dateFinished) {
      const date = dateFinished == null ? '' : String(dateFinished);
      if (date === '0') return 'Read long ago';

      const yearMatch = date.match(/\b((?:19|20)\d{2})\b|\/(\d{2})$/);
      return yearMatch ? yearMatch[1] || `20${yearMatch[2]}` : 'Pre-2016';
    }

    function renderBooks(viewMode = 'finished') {
      const container = document.querySelector('.bookshelf');
      if (!container) return;

      container.innerHTML = '';

      if (viewMode === 'toread') {
        const toreadBooks = books.filter(b => b.status === 'toread');
        toreadBooks.sort(()=>Math.random() - 0.5)
        toreadBooks.forEach(b => {
          container.appendChild(createBookElement(b, 'toread'));
        });
      } else if (viewMode === 'reading') {
        const currentlyReadingBooks = books.filter(b => b.status === 'reading');
        currentlyReadingBooks.forEach(b => {
          container.appendChild(createBookElement(b, 'reading'));
        });
      } else {
        const finishedBooks = books.filter(b => b.status === 'finished');
        const booksByYear = new Map();
        finishedBooks.forEach(b => {
          const year = finishedYear(b.date_finished);
          if (!booksByYear.has(year)) booksByYear.set(year, []);
          booksByYear.get(year).push(b);
        });

        [...booksByYear.entries()]
          .sort(([a], [b]) => {
            const yearA = Number(a);
            const yearB = Number(b);
            if (Number.isFinite(yearA) && Number.isFinite(yearB)) return yearB - yearA;
            if (Number.isFinite(yearA)) return -1;
            if (Number.isFinite(yearB)) return 1;
            return a.localeCompare(b);
          })
          .forEach(([year, yearBooks]) => {
            const heading = document.createElement('h2');
            heading.className = 'bookshelf-year';
            heading.textContent = year;
            container.appendChild(heading);
            yearBooks.forEach(b => {
              container.appendChild(createBookElement(b, 'finished'));
            });
          });
      }
    }

    document.addEventListener('click', function(e){
      if (!e.target.closest || !e.target.closest('.book')) {
        document.querySelectorAll('.book').forEach(book => book.classList.remove('active'));
      }
    });

    function setupFilters() {
      document.querySelectorAll('.filter-button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.filter-button').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          const filter = button.dataset.filter;
          renderBooks(filter);
        });
      });
    }

    Promise.all([
      fetch('./books.json').then(r => r.json()),
      fetch('./books-to-be-read.json').then(r => r.json())
    ]).then(([booksData, listData]) => {
      books = [...(booksData || []), ...(listData || [])];
      setupFilters();
      renderBooks('reading');
    })
  })();
</script>
