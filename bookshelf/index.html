---
layout: default
title: Bookshelf
extra_css: |
  <link href="/static/stylesheets/bookshelf.css" rel="stylesheet" type="text/css" media="all">
---
<h1 style="color: #cccccc">bookshelf</h1>
<div class="filter-section">
    <div class="filter-controls">
      <button class="filter-button active" data-filter="read">Reading &amp; Read</button>
      <button class="filter-button" data-filter="toread">To be read</button>
    </div>
    <br>
</div>

<div class="bookshelf">
  <div class="loading">JavaScript not supported (there should be a grid of book covers here).</div>
</div>
<script>
  (function(){
    let books = [];

    function createBookElement(b, status) {
      const div = document.createElement('div');
      div.className = 'book';
      div.dataset.status = status;

      div.addEventListener('click', function(e) {
        e.stopPropagation();
        document.querySelectorAll('.book').forEach(book => {
          if (book !== this) book.classList.remove('active');
        });
        this.classList.toggle('active');
      });

      const img = document.createElement('img');
      img.className = 'book-cover';
      img.src = '/static/images/BookCovers/' + (b.cover || '');
      img.alt = b.title || '';
      img.loading = 'lazy';
      div.appendChild(img);

      const info = document.createElement('div');
      info.className = 'book-info';

      const title = document.createElement('h3');
      title.className = 'book-title';
      title.textContent = b.title || 'Untitled';
      info.appendChild(title);

      const author = document.createElement('p');
      author.className = 'book-author';
      author.textContent = joinNameList(Array.isArray(b.authors) ? b.authors : []);
      info.appendChild(author);

      const meta = document.createElement('p');
      meta.className = 'book-meta';
      if (status === 'reading') {
        meta.textContent = b.date_started ? `Started ${b.date_started}` : 'Currently reading';
      } else if (status === 'toread') {
        meta.textContent = Number.isFinite(b.pages) && b.pages > 0
          ? `${b.pages.toLocaleString()} pages · To be read`
          : 'To be read';
      } else if (String(b.date_finished || '') === '0') {
        meta.textContent = 'Read long ago';
      } else if (b.date_finished) {
        meta.textContent = `Finished ${b.date_finished}`;
      } else {
        meta.textContent = 'Finish date unrecorded';
      }
      info.appendChild(meta);

      if (Array.isArray(b.genre) && b.genre.length > 0) {
        const tags = document.createElement('div');
        tags.className = 'book-tags';
        b.genre.slice(0, 2).forEach(genre => {
          const tag = document.createElement('span');
          tag.textContent = genre;
          tags.appendChild(tag);
        });
        info.appendChild(tags);
      }

      div.appendChild(info);
      return div;
    }

    function joinNameList(items) {
      if (items.length === 0) return '';
      if (items.length === 1) return items[0];
      if (items.length === 2) return `${items[0]} and ${items[1]}`;
      return `${items.slice(0, -1).join(', ')}, and ${items.at(-1)}`;
    }

    function finishedYear(dateFinished) {
      const date = dateFinished == null ? '' : String(dateFinished);
      if (date === '0') return 'Read long ago';

      const yearMatch = date.match(/\b((?:19|20)\d{2})\b|\/(\d{2})$/);
      return yearMatch ? yearMatch[1] || `20${yearMatch[2]}` : 'Pre-2016';
    }

    function shuffled(items) {
      const result = items.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function createBookshelfSection(container, title) {
      const section = document.createElement('section');
      section.className = 'bookshelf-section';

      const heading = document.createElement('h2');
      heading.className = 'bookshelf-heading';
      heading.textContent = title;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'bookshelf-books';
      section.appendChild(grid);
      container.appendChild(section);
      return grid;
    }

    function renderBooks(viewMode = 'read') {
      const container = document.querySelector('.bookshelf');
      if (!container) return;

      container.innerHTML = '';

      if (viewMode === 'toread') {
        const toreadBooks = books.filter(b => b.status === 'toread');
        const grid = document.createElement('div');
        grid.className = 'bookshelf-books';
        shuffled(toreadBooks).forEach(b => {
          grid.appendChild(createBookElement(b, 'toread'));
        });
        container.appendChild(grid);
        return;
      }

      const currentlyReadingBooks = books.filter(b => b.status === 'reading');
      if (currentlyReadingBooks.length > 0) {
        const grid = createBookshelfSection(container, 'Currently Reading');
        currentlyReadingBooks.forEach(b => {
          grid.appendChild(createBookElement(b, 'reading'));
        });
      }

      const finishedBooks = books.filter(b => b.status === 'finished');
      const booksByYear = new Map();
      finishedBooks.forEach(b => {
        const year = finishedYear(b.date_finished);
        if (!booksByYear.has(year)) booksByYear.set(year, []);
        booksByYear.get(year).push(b);
      });

      [...booksByYear.entries()]
        .sort(([a], [b]) => {
          const yearA = Number(a);
          const yearB = Number(b);
          if (Number.isFinite(yearA) && Number.isFinite(yearB)) return yearB - yearA;
          if (Number.isFinite(yearA)) return -1;
          if (Number.isFinite(yearB)) return 1;
          return a.localeCompare(b);
        })
        .forEach(([year, yearBooks]) => {
          const grid = createBookshelfSection(container, year);
          yearBooks.forEach(b => {
            grid.appendChild(createBookElement(b, 'finished'));
          });
        });
    }

    document.addEventListener('click', function(e){
      if (!e.target.closest || !e.target.closest('.book')) {
        document.querySelectorAll('.book').forEach(book => book.classList.remove('active'));
      }
    });

    function setupFilters() {
      document.querySelectorAll('.filter-button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.filter-button').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          const filter = button.dataset.filter;
          renderBooks(filter);
        });
      });
    }

    function fetchBooks(path) {
      return fetch(path).then(response => {
        if (!response.ok) throw new Error(`${path} request failed with status ${response.status}`);
        return response.json();
      }).then(data => {
        if (!Array.isArray(data)) throw new TypeError(`${path} must contain a JSON array`);
        return data;
      });
    }

    Promise.all([
      fetchBooks('./books.json'),
      fetchBooks('./books-to-be-read.json')
    ]).then(([booksData, listData]) => {
      books = [...booksData, ...listData];
      setupFilters();
      renderBooks('read');
    }).catch(error => {
      console.error('Failed to load bookshelf data', error);
      const container = document.querySelector('.bookshelf');
      if (container) container.textContent = 'The bookshelf could not be loaded. Please try again later.';
    })
  })();
</script>
